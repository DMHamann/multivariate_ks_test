[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multivariate_ks_test"
version = "0.1.0"
description = "Implementation of the multivariate Kolmogorov-Smirnov goodness-of-fit test."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]